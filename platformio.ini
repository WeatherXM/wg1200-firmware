; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = wg1200_open
src_dir = main

[env]
platform = espressif32@7.0.1
board = esp32s3box
framework = espidf
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbserial-*
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.filesystem = littlefs
build_flags = -w -Wno-error -Wl,--wrap=esp_panic_handler -DCONFIG_GATEWAY_EDITION_WXM=1
build_unflags = -mfix-esp32-psram-cache-issu -Werror=all -Werror -Wno-old-style-declaration
extra_scripts =
    pre:pre_actions.py
    post:tools/safe_erase.py
board_build.partitions = partitions_16MB_wxm.csv

debug_tool = esp-builtin


monitor_filters = esp32_exception_decoder

board_build.embed_files =
	; WXM MQTT only self-signed cert
	main/certs/wxm_mqtt.pem
	; WXM cert used for HTTPS
	main/certs/wxm.pem

	components/esp32-wifi-manager/src/style.css
	components/esp32-wifi-manager/src/code.js
	components/esp32-wifi-manager/src/index.html

; ----------------------------------------------------------------------
; Open / Community Edition (Default)
; Safe for standard ESP32-S3 boards. Uses virtual NVS keys and does NOT burn eFuses.
; ----------------------------------------------------------------------
[env:wg1200_open]
build_type = release
board_build.sdkconfig_defaults = sdkconfig.defaults
build_flags =
    -DWXM_ENV_RELEASE=1
    -DCONFIG_HW_NAME=\"WXM-WG1200-OPEN\"
    ${env.build_flags}

[env:wg1200_debug]
build_type = debug
board_build.sdkconfig_defaults = sdkconfig.defaults
build_flags =
    -DWXM_ENV_DEBUG=1
    -DCONFIG_HW_NAME=\"WXM-WG1200-DEV\"
    ${env.build_flags}

; ----------------------------------------------------------------------
; WeatherXM Internal Manufacturing & Production Release Only
; CAUTION: This target burns physical hardware eFuses on the ESP32-S3.
; Do NOT flash to generic development boards or unlocked community hardware.
; ----------------------------------------------------------------------
[env:wg1200_production]
build_type = release
build_flags =
    -DWXM_ENV_RELEASE=1
    -DCONFIG_WXM_PRODUCTION_BURN_EFUSES=1
    -DCONFIG_HW_NAME=\"WXM-WG1200\"
    ${env.build_flags}

[env:lilygo_sim7000_esp32]
platform = espressif32@7.0.1
board = esp32dev
framework = espidf
debug_tool = esp-prog
build_flags =
    ${env.build_flags}
    -DLILYGO_SIM7000_ESP32
    -DCONFIG_SCREENLESS
    -DCONFIG_CELLULAR_BACKUP
    -DWXM_ENV_RELEASE=1
    -DCONFIG_HW_NAME=\"WXM-LILYGO-SIM7000\"
board_build.partitions = partitions_16MB_wxm.csv
board_upload.flash_size = 16MB

[env:lilygo_sim7000g_s3_standard]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = espidf
build_flags =
    ${env.build_flags}
    -DLILYGO_SIM7000G_S3_STANDARD
    -DCONFIG_SCREENLESS
    -DCONFIG_CELLULAR_BACKUP
    -DWXM_ENV_RELEASE=1
    -DCONFIG_HW_NAME=\"WXM-LILYGO-SIM7000G-S3\"
board_build.partitions = partitions_16MB_wxm.csv
board_upload.flash_size = 16MB

[env:xiao_esp32s3]
platform = espressif32@7.0.1
board = seeed_xiao_esp32s3
framework = espidf
board_build.sdkconfig_defaults = sdkconfig.defaults sdkconfig.release sdkconfig.xiao_esp32s3
build_flags =
    ${env.build_flags}
    -DCONFIG_SCREENLESS
    -DWXM_ENV_RELEASE=1
    -DCONFIG_HW_NAME=\"WXM-XIAO-ESP32S3\"
board_build.partitions = partitions_8MB_wxm.csv
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.f_flash = 40000000L
board_build.bootloader_addr = 0x0
upload_speed = 460800
upload_flags = --before, default_reset, --after, hard_reset
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
